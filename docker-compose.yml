services:

  # ── Keycloak — Identity Provider ─────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: dev-file
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: INFO
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "18080:8080"
    healthcheck:
      # Checks the master realm — available once KC is fully initialized
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/realms/master > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - basis

  # ── Mosquitto — MQTT Broker ───────────────────────────────────────────────
  # Stage 6: anonymous access disabled. Clients must authenticate.
  # Password file is generated via: make mqtt-passwd (see README for full command)
  mosquitto:
    image: eclipse-mosquitto:2.0
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./infra/mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # MQTT over WebSocket
    healthcheck:
      # Stage 6: healthcheck authenticates as basis-api to verify auth is working
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -u basis-api -P basis-api-secret -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - basis

  # ── FastAPI — Backend API ─────────────────────────────────────────────────
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    environment:
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      KEYCLOAK_EXTERNAL_URL: ${KEYCLOAK_EXTERNAL_URL:-http://localhost:18080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-basis}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-basis-api}
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST:-mosquitto}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT:-1883}
      MQTT_USERNAME: ${MQTT_API_USERNAME:-basis-api}
      MQTT_PASSWORD: ${MQTT_API_PASSWORD:-basis-api-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # Stage 5b: SQLite audit DB path inside the audit_data named volume.
      # Override with AUDIT_DB_PATH env var if needed (e.g. for testing).
      AUDIT_DB_PATH: ${AUDIT_DB_PATH:-/data/audit.db}
    volumes:
      # Mount source for hot reload — Dockerfile installs deps at build time
      - ./services/api:/app
      # Stage 5b: persist audit DB across container restarts
      - audit_data:/data
    ports:
      - "8000:8000"
    depends_on:
      mosquitto:
        condition: service_healthy
    networks:
      - basis

  # ── React + Vite — Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    environment:
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:18080}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-basis}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-basis-frontend}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./services/frontend:/app
      # Preserve container's node_modules — prevents host mount from overwriting it
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - basis

  # ── OT Simulator — Fake HVAC & Sensor Data ───────────────────────────────
  simulator:
    build:
      context: ./services/simulator
      dockerfile: Dockerfile
    environment:
      MQTT_BROKER_HOST: ${SIMULATOR_MQTT_HOST:-mosquitto}
      MQTT_BROKER_PORT: ${SIMULATOR_MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_SIMULATOR_USERNAME:-basis-simulator}
      MQTT_PASSWORD: ${MQTT_SIMULATOR_PASSWORD:-basis-simulator-secret}
      HEARTBEAT_INTERVAL: ${SIMULATOR_HEARTBEAT_INTERVAL:-10}
    volumes:
      - ./services/simulator:/app
    depends_on:
      mosquitto:
        condition: service_healthy
    networks:
      - basis
    restart: on-failure

# ── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  mosquitto_data:
  mosquitto_logs:
  frontend_node_modules:
  # Stage 5b: audit_data persists the SQLite audit DB across container restarts.
  # Inspect: docker compose exec api sqlite3 /data/audit.db "SELECT * FROM audit_events"
  audit_data:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  basis:
    driver: bridge
