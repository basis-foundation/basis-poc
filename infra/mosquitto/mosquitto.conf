# Mosquitto configuration for Basis Foundation
# Stage 6: Anonymous access disabled. All clients must authenticate.
#
# Service credentials (defined in infra/mosquitto/passwd):
#   basis-api        — API subscriber and command publisher
#   basis-simulator  — OT device simulator (telemetry publisher, command subscriber)
#
# Credentials are injected into each service container via MQTT_USERNAME and
# MQTT_PASSWORD environment variables (see docker-compose.yml and .env.example).

# ── Authentication ────────────────────────────────────────────────────────────
# Global — applies to all listeners below.
allow_anonymous false
password_file /mosquitto/config/passwd

# ── MQTT listener (standard protocol, internal Docker network only) ────────────
listener 1883
protocol mqtt

# ── WebSocket listener (for browser clients in later stages) ──────────────────
listener 9001
protocol websockets

# ── Persistence ───────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ───────────────────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ── Connection limits ─────────────────────────────────────────────────────────
max_connections 100
