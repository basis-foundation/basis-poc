# Mosquitto configuration for Basis Foundation PoC
# Development only — anonymous access enabled, no TLS

# ── MQTT listener (standard protocol) ──────────────────────────────────────
listener 1883
protocol mqtt
allow_anonymous true

# ── WebSocket listener (for browser clients in later stages) ───────────────
listener 9001
protocol websockets
allow_anonymous true

# ── Persistence ────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ────────────────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ── Connection limits ──────────────────────────────────────────────────────
max_connections 100
